[package]
name = "notary"
version = "0.3.0"
edition = "2024"
description = "Private meeting notes for Mac, written in Rust with GPUI"
license = "MIT"
default-run = "notary"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["metal"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
screencapturekit = { version = "11.1.2", features = ["macos_13_0", "macos_15_0"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.5.2"
whisper-rs = { version = "0.16.0", features = ["metal"] }
